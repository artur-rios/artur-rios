# What Jenkins checks for this repository, read by the pipeline of the yggdrasil installation that runs it (yggdrasil's
# docs/catalog.md, "Repository pipeline file", has every field). It is data, never code: images (pinned by version and
# digest, which Renovate keeps up to date), commands and globs. The commands are scripts under ci/ that run from the
# repository's root, so you can run them on your own machine too. The repository is the owner's profile README:
# there is nothing to build, so its one check is `lint`.
#
# Check it where the catalog is, in the yggdrasil checkout:
#   python3 scripts/pipeline_config.py describe artur-rios <this repository's checkout>

checks:
  lint: # markdownlint-cli2 (.markdownlint-cli2.jsonc) and codespell over the README, both pinned in ci/lint.sh
    image: node:24.22.2-bookworm@sha256:8fa96264f302f58bbb13aa7339c541547b56975766ce956c875da149452a3e40
    run: ci/lint.sh
